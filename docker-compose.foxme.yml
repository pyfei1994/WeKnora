# FoxMe 定制版 WeKnora 部署覆盖文件
#
# 用途：把官方 docker-compose.yml 里我们自己构建的三个镜像
#       （frontend/ui、app、docreader）替换成阿里云私有镜像库的定制版本。
#       其余服务（postgres / redis / minio / langfuse / qdrant 等）
#       以及全部配置仍然来自官方 base compose，不做改动。
#
# 用法（在仓库根目录，与官方 docker-compose.yml 同级）：
#   docker compose -f docker-compose.yml -f docker-compose.foxme.yml up -d
#
# 说明：
#   - 不要加 --build，镜像直接从阿里云拉取。
#   - sandbox 镜像我们没有重建，继续用官方 wechatopenai/weknora-sandbox。
#   - 当前版本基线：官方 tag v0.7.2；定制分支 feat/builtin-toggle。
#   - 升级官方版本后，只需把下面三个 tag 改成新的 0.7.x-foxme 即可。
#   - postgres / redis 的 ports 是本机调试用的（Navicat/psql 等外部客户端），
#     官方 base compose 故意不暴露端口。默认绑 127.0.0.1（仅本机），
#     如需局域网访问请改成 0.0.0.0。

services:
  frontend:
    image: registry.cn-shanghai.aliyuncs.com/eftik/foxme-weknora-ui:0.7.2-foxme

  app:
    image: registry.cn-shanghai.aliyuncs.com/eftik/foxme-weknora-app:0.7.2-foxme

  docreader:
    image: registry.cn-shanghai.aliyuncs.com/eftik/foxme-weknora-docreader:0.7.2-foxme

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
