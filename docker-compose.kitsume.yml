# KitsuMe 定制版 WeKnora 部署覆盖文件
#
# 用途：把官方 docker-compose.yml 里我们自己构建的三个镜像
#       （frontend/ui、app、docreader）替换成阿里云私有镜像库的定制版本。
#       其余服务（postgres / redis / minio / langfuse / qdrant 等）
#       以及全部配置仍然来自官方 base compose，不做改动。
#
# 用法（在仓库根目录，与官方 docker-compose.yml 同级）：
#   docker compose -f docker-compose.yml -f docker-compose.kitsume.yml up -d
#
# 说明：
#   - 不要加 --build，镜像直接从阿里云拉取。
#   - sandbox 镜像我们没有重建，继续用官方 wechatopenai/weknora-sandbox。
#   - 当前版本基线：官方 tag v0.8.0；定制分支 feature/v0.8.0-kitsume（详见 CUSTOMIZATIONS.md）。
#   - 升级官方版本后，只需把下面三个 tag 改成新的 x.y.z-kitsume 即可。
#   - postgres / redis 的宿主端口已由官方 base compose 暴露
#     （postgres: ${DB_PORT:-5432}，redis: 6379），此处不再重复映射，
#     否则会被 compose 追加合并成两条冲突端口，导致容器绑定失败。

services:
  frontend:
    image: registry.cn-shanghai.aliyuncs.com/eftik/kitsume-weknora-ui:0.8.0-kitsume

  app:
    image: registry.cn-shanghai.aliyuncs.com/eftik/kitsume-weknora-app:0.8.0-kitsume

  docreader:
    image: registry.cn-shanghai.aliyuncs.com/eftik/kitsume-weknora-docreader:0.8.0-kitsume
